name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Deploy para Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Adicione aqui os comandos específicos para deploy no staging
        # Exemplo: usando Docker, Heroku, AWS, etc.
        
    - name: Notify deployment
      run: |
        echo "✅ Successfully deployed to staging!"
        # Adicione aqui notificações (Slack, Discord, etc.)

  # Deploy para Produção
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # Adicione aqui os comandos específicos para deploy em produção
        # Exemplo: usando Docker, Heroku, AWS, etc.
        
    - name: Notify deployment
      run: |
        echo "✅ Successfully deployed to production!"
        # Adicione aqui notificações (Slack, Discord, etc.)
